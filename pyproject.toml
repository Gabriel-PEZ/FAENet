
[project]
name = "faenet"
version = "0.1.0"
description = "FAENet implementation"
readme = "README.md"
authors = [
    { name = "Gabriel-PEZ", email = "gabrielpezennec@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy",
    "matplotlib",
    "tqdm",
    "torch-geometric>=2.8.1",
]

[project.optional-dependencies]
cpu = [
    "torch",
]
cu130 = [
    "torch",
]

[project.scripts]
faenet = "faenet:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu130" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "cu130" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.1.1",
]
